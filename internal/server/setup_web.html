<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yuanshu Server Setup</title>
  <style>
    :root{color-scheme:dark;font:15px/1.5 system-ui,-apple-system,sans-serif;background:#0b0e0c;color:#eef3ef}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#0b0e0c}.shell{min-height:100dvh;display:grid;grid-template-columns:260px 1fr}.rail{padding:28px 24px;border-right:1px solid #252b27;background:#0e1210}.brand{display:flex;align-items:center;gap:12px;margin-bottom:36px}.brand svg{width:38px}.brand strong{display:block}.brand small,.muted{color:#87928b}.steps{display:grid;gap:4px}.steps span{padding:9px 10px;border-radius:8px;color:#657069}.steps span.active{background:#17201b;color:#dff5e7}.steps span.done{color:#72d7a2}.main{min-width:0;display:grid;grid-template-rows:auto 1fr auto}.top{display:flex;justify-content:flex-end;padding:18px 28px}.language{display:flex;gap:6px;align-items:center;color:#738078}.language button{border:0;background:none;color:inherit;padding:5px;cursor:pointer}.language button.active{color:#72d7a2}.stage{width:min(720px,calc(100% - 40px));margin:auto;padding:24px 0 48px}.eyebrow{color:#72d7a2;text-transform:uppercase;letter-spacing:.14em;font-size:11px;font-weight:700}.stage h1{font-size:clamp(30px,5vw,46px);letter-spacing:-.04em;line-height:1.08;margin:8px 0 12px}.stage>p{color:#9aa59e;max-width:620px}.panel{margin-top:30px;display:grid;gap:16px}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mode{padding:18px;text-align:left;background:#101512;border:1px solid #2b332e;border-radius:8px;color:inherit;cursor:pointer}.mode.active{border-color:#72d7a2;background:#132019}.mode strong,.mode small{display:block}.mode small{margin-top:5px;color:#87928b}.field{display:grid;gap:6px}.field span{font-weight:600}.field input,.field select{width:100%;padding:12px;border:1px solid #323a35;border-radius:8px;background:#111613;color:inherit;font:inherit}.check{display:flex;gap:10px;align-items:center}.review{border:1px solid #2a332d;border-radius:8px;background:#101512;padding:20px;white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}.actions{display:flex;justify-content:space-between;gap:12px;padding:18px 28px;border-top:1px solid #252b27}.actions div{display:flex;gap:8px}.button{min-height:44px;padding:0 18px;border:1px solid #343d37;border-radius:8px;background:#131815;color:inherit;font:inherit;cursor:pointer}.button.primary{background:#72d7a2;border-color:#72d7a2;color:#07110b;font-weight:700}.button:disabled{opacity:.45;cursor:not-allowed}.notice{padding:12px 14px;border-radius:8px;background:#201c10;color:#e9ce78}.complete-link{display:block;margin-top:20px;color:#72d7a2;word-break:break-all}.qr{width:180px;background:white;padding:8px;border-radius:8px}@media(max-width:760px){.shell{display:block}.rail{border:0;border-bottom:1px solid #252b27;padding:18px 20px}.brand{margin:0}.steps{display:none}.top{position:absolute;right:0;top:3px}.stage{padding-top:36px}.mode-grid{grid-template-columns:1fr}.actions{position:sticky;bottom:0;background:#0b0e0cf2;padding:12px 20px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
  </style>
</head>
<body><main class="shell"><aside class="rail"><div class="brand"><svg viewBox="80 80 352 352" aria-hidden="true"><path fill="#E7EEE9" d="M113 164h71v31c0 7 3 13 8 18l51 51c4 4 6 9 6 15v31c0 6 3 9 7 9s7-3 7-9v-31c0-6 2-11 6-15l51-51c5-5 8-11 8-18v-31h71c5 0 9 4 9 9v34c0 8-4 15-10 20l-97 83c-7 6-10 14-10 23v64c0 8-6 13-14 13h-42c-8 0-14-5-14-13v-64c0-9-3-17-10-23l-97-83c-6-5-10-12-10-20v-34c0-5 4-9 9-9Z"/><g fill="#72D7A2"><rect width="55" height="55" x="104" y="102" rx="9"/><rect width="55" height="55" x="353" y="102" rx="9"/><rect width="48" height="48" x="232" y="179" rx="5" transform="rotate(45 256 203)"/></g></svg><div><strong>Yuanshu Server</strong><small>Local setup</small></div></div><nav class="steps" id="steps"></nav></aside><section class="main"><header class="top"><div class="language"><button data-lang="zh-CN">中文</button><span>|</span><button data-lang="en-US">English</button></div></header><div class="stage" id="stage"></div><footer class="actions" id="actions"><button class="button" id="cancel">取消</button><div><button class="button" id="back">上一步</button><button class="button primary" id="next">下一步</button></div></footer></section></main>
<script type="module">
const bootstrap=location.hash.slice(1);history.replaceState(null,"",location.pathname);let session="",catalogs={},locale="",step=0,readOnly=false,review="",result=null;const state={mode:"local",dataDir:"",listen:"127.0.0.1:9527",publicURL:"",tlsTermination:"",certFile:"",keyFile:"",acmeEnvironment:"production",acmeEmail:"",acceptTerms:false};
const ids=["language","mode","location","tls","preflight","review","complete"];const $=value=>document.querySelector(value);const t=key=>catalogs[locale]?.[key]||catalogs["zh-CN"]?.[key]||key;const auth=()=>session?{"Authorization":"YuanshuSetup "+session}:{};async function request(path,method="GET",body){const response=await fetch(path,{method,headers:{...auth(),...(body?{"Content-Type":"application/json"}:{})},body:body?JSON.stringify(body):undefined});const value=await response.json();if(!response.ok)throw new Error(value.code||value.error||"request_failed");return value}
function field(name,label,type="text",extra=""){return `<label class="field"><span>${label}</span><input name="${name}" type="${type}" value="${escapeHTML(state[name]??"")}" ${extra}></label>`}function select(name,label,items){return `<label class="field"><span>${label}</span><select name="${name}">${items.map(([value,text])=>`<option value="${value}" ${state[name]===value?"selected":""}>${text}</option>`).join("")}</select></label>`}function escapeHTML(value){return String(value).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c])}
function sync(){document.documentElement.lang=locale||"zh-CN";document.querySelectorAll("[data-lang]").forEach(button=>button.classList.toggle("active",button.dataset.lang===locale));const inputs=$("#stage").querySelectorAll("input,select");inputs.forEach(input=>{input.addEventListener("input",()=>{state[input.name]=input.type==="checkbox"?input.checked:input.value;review=""})});$("#back").textContent=t("common.back");$("#next").textContent=step===5?t("common.apply"):step===6?t("common.done"):t("common.next");$("#cancel").textContent=t("common.cancel");$("#back").disabled=step===0||step===6;$("#cancel").hidden=step===6;$("#steps").innerHTML=ids.map((id,index)=>`<span class="${index===step?"active":index<step?"done":""}">${String(index+1).padStart(2,"0")} · ${t("setup.server.step."+id)}</span>`).join("")}
function render(){let html=`<p class="eyebrow">${t("setup.server.step."+ids[step])}</p>`;if(step===0)html+=`<h1>${t("language.choose.title")}</h1><p>${t("language.choose.description")}</p><div class="panel mode-grid"><button class="mode" data-choose="zh-CN"><strong>中文</strong><small>简体中文</small></button><button class="mode" data-choose="en-US"><strong>English</strong><small>English (US)</small></button></div>`;if(step===1)html+=`<h1>${t("setup.server.step.mode")}</h1><p>${t("setup.server.subtitle")}</p><div class="panel mode-grid">${[["local","local"],["lan-managed","lanManaged"],["public-ip-acme","publicIP"],["external","external"]].map(([value,key])=>`<button class="mode ${state.mode===value?"active":""}" data-mode="${value}"><strong>${t("setup.server.mode."+key)}</strong><small>${t("setup.server.mode."+key+".help")}</small></button>`).join("")}</div>`;if(step===2)html+=`<h1>${t("setup.server.step.location")}</h1><div class="panel">${field("dataDir",t("setup.server.dataDir"),"text","required")}${field("listen",t("setup.server.listen"),"text","required list=interfaces")}${state.mode!=="local"?field("publicURL",t("setup.server.publicURL"),"url","required"):""}<datalist id="interfaces"></datalist></div>`;if(step===3)html+=`<h1>${t("setup.server.step.tls")}</h1><div class="panel">${state.mode==="external"?select("tlsTermination",t("setup.server.tlsTermination"),[["server","Server"],["proxy","Reverse proxy"]]):""}${state.mode==="external"&&state.tlsTermination!=="proxy"?field("certFile",t("setup.server.certFile"))+field("keyFile",t("setup.server.keyFile"),"password","autocomplete=off"):""}${state.mode==="public-ip-acme"?select("acmeEnvironment",t("setup.server.acmeEnvironment"),[["production","production"],["staging","staging"]])+field("acmeEmail",t("setup.server.acmeEmail"),"email")+`<label class="check"><input name="acceptTerms" type="checkbox" ${state.acceptTerms?"checked":""}><span>${t("setup.server.acceptTerms")}</span></label>`:""}${state.mode==="lan-managed"?`<p class="muted">${t("setup.server.mode.lanManaged.help")}</p>`:""}${state.mode==="local"?`<p class="muted">${t("setup.server.mode.local.help")}</p>`:""}</div>`;if(step===4)html+=`<h1>${t("setup.server.step.preflight")}</h1><p>${t("setup.server.preflight.help")}</p><div class="panel"><div class="review">${escapeHTML([state.mode,state.listen,state.publicURL||"loopback",state.tlsTermination||"managed"].join("\n"))}</div></div>`;if(step===5)html+=`<h1>${t("setup.server.step.review")}</h1><p>${t("setup.server.review.help")}</p><div class="panel"><div class="review">${escapeHTML(review)}</div></div>`;if(step===6)html+=`<h1>${t("setup.server.complete.title")}</h1><p>${t("setup.server.complete.description")}</p>${result?`<a class="complete-link" href="${escapeHTML(result.accessUrl)}">${escapeHTML(result.accessUrl)}</a>${result.caFingerprint?`<p class="muted">${t("trust.fingerprint")}: ${escapeHTML(result.caFingerprint)}</p>`:""}${result.qrDataUrl?`<img class="qr" src="${result.qrDataUrl}" alt="QR">`:""}`:""}`;$("#stage").innerHTML=html;sync();document.querySelectorAll("[data-choose]").forEach(button=>button.onclick=()=>{locale=button.dataset.choose;state.locale=locale;step=1;render()});document.querySelectorAll("[data-mode]").forEach(button=>button.onclick=()=>{state.mode=button.dataset.mode;if(state.mode==="local"){state.listen="127.0.0.1:9527";state.publicURL=""}else if(state.listen.startsWith("127.")||state.listen.startsWith("[::1]"))state.listen="0.0.0.0:9527";render()});}
async function next(){try{if(!locale)return;if(step===4){review=(await request("/api/preflight","POST",state)).summary;step=5}else if(step===5){result=await request("/api/apply","POST",state);step=6}else if(step<6)step++;render()}catch(error){$("#stage").insertAdjacentHTML("beforeend",`<p class="notice" role="alert">${escapeHTML(error.message)}</p>`)}}
$("#back").onclick=()=>{if(step>0){step--;render()}};$("#next").onclick=()=>void next();$("#cancel").onclick=()=>window.close();document.querySelectorAll("[data-lang]").forEach(button=>button.onclick=()=>{locale=button.dataset.lang;state.locale=locale;render()});
try{catalogs=await fetch("/api/locales").then(response=>response.json());session=(await request("/api/session","POST",{token:bootstrap})).session;const initial=await request("/api/state");Object.assign(state,initial.config||{});readOnly=initial.readOnly;if(state.locale)locale=state.locale;render();if(readOnly){$("#next").disabled=true;$("#stage").insertAdjacentHTML("beforeend",`<p class="notice">${t("setup.server.readOnly")}</p>`)}}catch(error){$("#stage").innerHTML=`<p class="notice">${escapeHTML(error.message)}</p>`}
</script></body></html>
