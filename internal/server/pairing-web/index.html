<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title data-i18n="pair.title">连接到远枢</title>
  <link rel="stylesheet" href="/pair/style.css">
</head>
<body>
  <main>
    <header><span><img class="mark" src="/pair/logo.svg" alt="">远枢 Yuanshu</span><span class="language-switch" aria-label="Language"><button type="button" data-locale="zh-CN">中文</button><i>|</i><button type="button" data-locale="en-US">English</button></span></header>
    <section class="card">
      <p class="eyebrow">安全配对</p>
      <h1 data-i18n="pair.title">连接这个浏览器</h1>
      <p class="lead" data-i18n="pair.subtitle">密钥只保存在此浏览器。确认后可安全访问自己的 Node。</p>
      <label for="name" data-i18n="pair.deviceName">设备名称</label>
      <input id="name" maxlength="128" autocomplete="off" value="My browser">
      <button id="pair" type="button" data-i18n="pair.request">请求连接</button>
      <div id="result" class="result" role="status" aria-live="polite">
        <span class="dot"></span><span id="status" data-i18n="pair.waiting">等待配对链接</span>
      </div>
      <dl id="details" hidden><dt data-i18n="pair.fingerprint">安全指纹</dt><dd id="fingerprint"></dd></dl>
      <a id="continue" href="/" hidden data-i18n="pair.openWorkbench">打开工作台</a>
    </section>
    <p class="foot" data-i18n="pair.expiry">配对链接短时有效且只能使用一次。</p>
  </main>
  <script src="/pair/app.js" type="module"></script>
</body>
</html>
