name: Feature request
description: Propose a focused improvement to the personal remote-agent workflow
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Personal-use problem
      description: Describe the user problem before proposing an implementation.
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: Scenario
      description: Which device, Node, workspace, and task flow is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the smallest useful outcome, not only a UI or protocol shape.
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security and data impact
      description: Note any effect on credentials, paths, task content, Server storage, approvals, leases, or remote control.
      placeholder: No change, or describe the boundary that must change.
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I checked that this is not already covered by an existing Issue or documented roadmap item.
          required: true
        - label: I did not include credentials, private task content, absolute paths, or private infrastructure details.
          required: true
